<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/bookTrip.css" />
    <link rel="stylesheet" href="../css/all.min.css" />
    <link rel="stylesheet" href="cardjs.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.0.3/css/font-awesome.css"
    />
    <title>BookTrip</title>
  </head>
  <body>
    <div id="settings"></div>

    <div id="header"></div>

    <div class="Layout">
      <main>
        <!-- MultiStep Form -->
        <div class="container-fluid" id="grad1">
          <div class="row justify-content-center mt-0">
            <div class="col-11 col-sm-9 col-md-7 col-lg-6 text-center p-0 mt-3 mb-2">
              <div class="card px-0 pt-4 pb-0 mt-3 mb-3">
                <div style="padding-left: 20px;">
                <h2><strong>Book Your Trip</strong></h2>
                <p>Fill all form field to go to next step</p>
                </div>
                <div class="row">
                  <div class="col-md-12 mx-0">

                    <form id="msform">
                      <!-- progressbar -->
                      <ul id="progressbar">
                        <li class="active" id="trip">
                          <strong>Trip</strong>
                        </li>
                        <li id="seatsFieled"><strong>Seats</strong></li>
                        <li id="personal"><strong>Personal</strong></li>
                       <!--<li id="payment"><strong>Payment</strong></li>-->
                        <li id="confirm"><strong>Finish</strong></li>
                      </ul>

                      <!-- fieldsets -->
                      <fieldset>
                        <div class="form-card">
                          <h2 class="fs-title">Trip Information</h2>
                          <div class="radio-group trip-type">
                            <div>
                              <input
                                id="rdInternational"
                                name="tripType"
                                value="International"
                                type="radio"
                              />
                              <label for="rdInternational">
                                <span></span>
                                International Trip
                              </label>
                            </div>
                            <div>
                              <input
                                id="rdNational"
                                name="tripType"
                                value="National"
                                type="radio"
                                checked="checked"
                              />
                              <label for="rdNational">
                                <span></span>
                                National Trip
                              </label>
                            </div>
                          </div>

                          <div class="select-group">
                            <div class="date-wrapper">
                              <input
                                type="date"
                                id="TripDate"
                                name="TripDate"
                                required
                              />
                              <label for="TripDate">Select Trip Date</label>
                            </div>

                            <select
                              class="make-margins"
                              id="tripsSelect"
                              name="TheTrip"
                            >
                            <option value="" selected disabled hidden>
                                Select Your Trip
                              </option>
                            </select>

                            <select
                              class="make-margins"
                              id="tripTimes"
                              name="tripTimes"
                              disabled
                            >
                            <option value="" selected disabled hidden>
                                Select Trip Time
                              </option>
                            </select>

                            <select
                              class="make-margins"
                              id="status"
                              name="status"
                            >
                              <option value="" selected disabled hidden>
                                Trip Status
                              </option>
                              <option value="On Going">On Going</option>
                              <option value="Stopped">Stopped</option>
                              <option value="Soon">Soon</option>
                            </select>

                            <select
                              class="make-margins"
                              id="payment"
                              name="payment"
                            >
                              <option value="" selected disabled hidden>
                                Payment Method
                              </option>
                              <option value="Visa">Visa</option>
                              <option value="MasterCard">MasterCard</option>
                              <option value="Qliq">Qliq</option>
                              <option value="Cash">Cash</option>
                            </select>
                          </div>
                          <div id="selects_ErrorMessage" style="display: none;"></div>

                          <div class="inputs-group">
                          <input
                            type="tel"
                            id="phoneNumber"
                            name="phone_Number"
                            placeholder="Phone Number (+123)"
                            required
                            maxlength="20"
                          />
                          <input
                            class="make-margins"
                            type="number"
                            name="adult"
                            id="adult"
                            max="10"
                            min="1"
                            placeholder="Enter number of adults"
                          />
                          <input
                            class="make-margins"
                            type="number"
                            name="child"
                            id="child"
                            max="10"
                            min="0"
                            placeholder="Enter number of childs"
                          />
                          <input
                            class="make-margins"
                            type="number"
                            name="disable"
                            id="disable"
                            max="10"
                            min="0"
                            placeholder="Enter number of disableds"
                          />
                        </div>
                          <div id="inputs_ErrorMessage" style="display: none;"></div>

                        </div>
                        <input
                          type="button"
                          name="next"
                          class="next action-button"
                          value="Next Step"
                        />
                      </fieldset>

                      <fieldset>
                        <div class="form-card">
                          <h2 class="fs-title">Setting Seats</h2>
                          <span id="totalAmount"></span>
                          <br>
                          <div class="row">
                            <div class="bus">
                                <!-- Front -->
                                <div class="bus-front">
                                  <div class="driver">Driver</div>
                                </div>
                                <!-- Main seats 2 + aisle + 2 -->
                                <div class="seats-main" id="seatsMain"></div>
                                <br>
                                <!-- Last row (6 seats) -->
                                <div class="seats-back" id="seatsBack"></div>
                              </div>

                            </div>
                          </div>
                        <input
                          type="button"
                          name="previous"
                          class="previous action-button-previous"
                          value="Previous"
                        />
                        <input
                          type="button"
                          name="next"
                          class="next action-button"
                          value="Next Step"
                        />
                      </fieldset>

                      <fieldset>
                        <div class="form-card">
                          <h2 class="fs-title">Tickets Information</h2>
                           <div class="ticketsContainer">

                           </div>
                           <div id="Ticketsinputs_ErrorMessage" style="display: none;"></div>
                        </div>
                        <input
                          type="button"
                          name="previous"
                          class="previous action-button-previous"
                          value="Previous"
                        />
                        <input
                          type="button"
                          name="next"
                          class="next action-button"
                          value="Next Step"
                        />
                      </fieldset>

                      <div class="popup" id="popup">
                        <div class="popup-box">
                           <h3>Are you sure you want to book this trip?</h3>
                           <input type="button" id="btnYes" class="action-button" style="background-color: rgb(8, 146, 8);" value="Yes">
                           <input type="button" id="btnCancel" class="action-button" style="background-color: rgb(172, 24, 14);" value="Cancel">
                        </div>
                      </div>

                    <!--<fieldset>
                        <div class="form-card">
                          <h2 class="fs-title">Payment Information</h2>
                          <div class="card-js form-group">
                                
                          </div>
                          <button type="submit">Check Payment</button>
                        </div>
                        <input
                          type="button"
                          name="previous"
                          class="previous action-button-previous"
                          value="Previous"
                        />
                        <input
                          type="button"
                          name="make_payment"
                          class="next action-button"
                          value="Confirm"
                        />
                      </fieldset>-->

                      <fieldset>
                        <div class="form-card">
                          <h2 class="fs-title text-center" style="color: greenyellow;">Booked Successfully</h2>
                          <div class="row justify-content-center">
                            <div class="col-3">
                              <img
                                src="https://img.icons8.com/color/96/000000/ok--v2.png"class="fit-image"/>
                            </div>
                          </div>
                          <div class="row justify-content-center">
                            <div class="col-7 text-center">
                              <h5><a href="../html/Profile.html" style="text-decoration: none; color: aliceblue; background-color: rgb(6, 122, 189); margin-left: 10px; padding: 17px; border-radius: 12px;">Show Trip Tickets</a></h5>
                            </div>
                          </div>
                        </div>
                      </fieldset>
                      <!-- fieldsets -->
                    </form>

                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>

    <div id="footer"></div>

    <script src="../js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/bookTrip.js"></script>
    <script src="cardjs.js"></script>
  </body>
</html>
