<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" />
    <link rel="stylesheet" href="../css/Login.css">
    <link rel="stylesheet" href="../css/all.min.css">
    <title>Login</title>
</head>
<body>
     <div class="container">
      <div class="forms">

        <!-- Login Form -->
        <div class="form login">
          <span class="title">Login</span>

          <form id="loginForm" method="POST" novalidate>
            <div class="input-field">
             <input id="loginPhoneNumber" type="tel" class="loginPhoneNumber" name="phone_Number" placeholder="Phone Number (+123)" required maxlength="20" />
              <i class="uil uil-phone"></i>
            </div>
            <div class="input-field">
              <input id="loginPassword" type="password" class="password" placeholder="Enter your password" required />
              <i class="uil uil-lock icon"></i>
              <i class="uil uil-eye-slash showHidePw"></i>
            </div>
            <div class="checkbox-text">
              <div class="checkbox-content">
                <input type="checkbox" id="logCheck" />
                <label for="logCheck" class="text">Remember me</label>
              </div>
              <a href="#" class="text">Forgot password?</a>
            </div>
            <br>
             <div id="Login_ErrorMessage" style="display: none;"></div>

              <div class="status muted" id="loading" style="display: none">
              <div class="spinner"></div>
              <div>Logging in...</div>
            </div>

            <div class="input-field button">
              <input type="submit" value="Login" />
            </div>
          </form>
          <div class="login-signup">
            <span class="text"
              >Not a member?
              <a href="#" class="text signup-link">Signup Now</a>
            </span>
          </div>
        </div>

        <!-- Registration Form -->
        <div class="form signup" >
          <span class="title">Registration</span>
          <form id="registerForm" method="POST" novalidate  >
            <div class="input-field">
              <input type="text" id="FullName" placeholder="Full Name" required />
              <i class="uil uil-user"></i>
            </div>
            <div class="input-field">
              <input type="tel" id="PhoneNumber" class="phoneNumber" name="phone_Number" placeholder="Phone Number (+123)" required maxlength="20" />
              <i class="uil uil-phone"></i>
            </div>
            <div class="input-field">
              <input id="DateOfBirth" type="date"required />
              <i class="uil uil-schedule"></i>
            </div>
            <div class="input-field">
              <select id="Nationality" name="Nationality" required>
                <option value="" selected disabled hidden>Nationality</option>
              </select>
            </div>
            <div class="input-field">
              <input type="password" id="Password" class="password" placeholder="Create a password" required />
              <i class="uil uil-lock icon"></i>
            </div>
            <div class="input-field">
              <input type="password" id="ConfirmPassword" class="password" placeholder="Confirm a password" required/>
              <i class="uil uil-lock icon"></i>
              <i class="uil uil-eye-slash showHidePw"></i>
            </div>
            <div class="checkbox-text">
              <div class="checkbox-content">
                <input type="checkbox" id="termCon" />
                <label for="termCon" class="text">I accepted all terms and conditions</label>
              </div>
            </div>
            <br>
            <div id="Register_ErrorMessage" style="display: none;"></div>

            <div class="status muted" id="loading" style="display: none">
              <div class="spinner"></div>
              <div>Signing up...</div>
            </div>

            <div class="input-field button">
              <input type="submit" value="Signup" />
            </div>
          </form>
          <div class="login-signup">
            <span class="text"
              >Already a member?
              <a href="#" class="text login-link">Login Now</a>
            </span>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/all.min.js"></script>
    <script type="module" src="../js/Loginjs.js"></script>

</body>
</html>
