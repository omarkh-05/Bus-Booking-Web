<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/editProfile.css">
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-md rounded-2xl profile-card overflow-hidden">
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-center">
            <h1 class="text-white text-2xl font-bold">Edit Profile</h1>
        </div>

        <div class="p-8">
            <form id="profileForm" class="space-y-6">
                <!-- Avatar Section -->
                <div class="flex flex-col items-center">
                    <div class="relative group">
                        <div class="w-32 h-32 rounded-full border-4 border-indigo-100 overflow-hidden bg-gray-100">
                            <img id="avatarPreview" src="https://ui-avatars.com/api/?name=User&background=random&size=128" alt="Avatar" class="w-full h-full object-cover">
                        </div>
                        <label for="avatarInput" class="absolute bottom-0 right-0 bg-indigo-600 p-2 rounded-full text-white cursor-pointer hover:bg-indigo-700 transition-colors shadow-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </label>
                        <input type="file" id="avatarInput" class="hidden" accept="image/*">
                    </div>
                    <p class="mt-2 text-sm text-indigo-600 font-semibold uppercase tracking-wide">Change Photo</p>
                </div>

                <!-- Input Fields -->
                <div class="space-y-4">
                    <!-- Name -->
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1 ml-1">Name</label>
                        <input type="text" id="userName" placeholder="Enter your full name" 
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
                        <p id="nameError" class="text-red-500 text-xs mt-1 hidden">Name must be at least 3 characters long.</p>
                    </div>

                    <!-- Phone -->
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1 ml-1">Phone</label>
                        <input type="tel" id="userPhone" placeholder="+1234567890" 
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
                        <p id="phoneError" class="text-red-500 text-xs mt-1 hidden">Please enter a valid phone number.</p>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1 ml-1">Email</label>
                        <input type="email" id="userEmail" placeholder="example@mail.com" 
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
                        <p id="emailError" class="text-red-500 text-xs mt-1 hidden">Please enter a valid email address.</p>
                    </div>

                    <!-- Description -->
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1 ml-1">Description</label>
                        <input type="textarea" id="userDescription" placeholder="Enter Description About You" 
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
                        <p id="descriptionError" class="text-red-500 text-xs mt-1 hidden">Description must be at least 50 characters long.</p>
                    </div>
                </div>


                <!-- Action Buttons -->
                <div class="flex gap-3 pt-2">
                    <button type="button" id="cancelBtn" 
                        class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-4 rounded-xl transition active:scale-95 flex items-center justify-center">
                        Cancel
                    </button>
                    <button type="submit" id="saveBtn" 
                        class="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transform transition active:scale-95 flex items-center justify-center">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Success Message Modal -->
    <div id="successModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Updated!</h2>
            <p class="text-gray-600 mb-6">Your profile changes have been saved successfully.</p>
            <button id="closeModalBtn" class="w-full bg-gray-800 text-white font-bold py-3 rounded-xl hover:bg-gray-900 transition">Close</button>
        </div>
    </div>

    <script type="module" src="../js/editProfile.js">
    </script>
</body>
</html>
